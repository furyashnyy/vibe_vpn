[package]
name = "rustine"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Rustine | Vibe VPN — authenticated two-hop TLS tunnel"

[dependencies]
anyhow = "1.0"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
serde = { version = "1.0", features = ["derive", "env"] }
sha2 = "0.10"
tokio = { version = "1.44", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls-pemfile = "2.2"
zeroize = "1.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
